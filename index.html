<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafie — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-size: 16px; }
    body { color: #fff; overflow-x: hidden; background: #07050f; }
    #root { min-height: 100vh; }

    #bg-video {
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    #bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(to bottom,
        rgba(6,4,18,0.50) 0%,
        rgba(6,4,18,0.42) 40%,
        rgba(6,4,18,0.65) 100%
      );
    }

    @keyframes fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes avatarIn { from { opacity:0; transform:scale(0.72); } to { opacity:1; transform:scale(1); } }
    @keyframes rotateBorder { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    @keyframes badgePulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(56,139,255,0.7); }
      50%      { box-shadow: 0 0 0 6px rgba(56,139,255,0); }
    }

    input[type=range] { -webkit-appearance:none; width:100%; height:3px; border-radius:2px; background:#2d1b4e; outline:none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; }
    input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; border:none; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#3d2060; border-radius:4px; }
  </style>
</head>
<body>

<!--
  GANTI SRC VIDEO DI BAWAH INI DENGAN URL VIDEO KAMU
  Contoh: src="https://example.com/video.mp4"
  atau pakai file lokal: src="video.mp4"
-->
<video id="bg-video" autoplay muted loop playsinline
  src="src/assets/jayjo.mp4">
</video>
<div id="bg-overlay"></div>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;
const LS_KEY = 'rafie_style_v4';

const ACCENT_COLORS = ['#388bff','#22c55e','#ec4899','#a855f7','#f97316','#6366f1','#f59e0b','#06b6d4'];
const FONTS = ['Inter','Poppins','Sora','Outfit'];

const DEFAULT_STYLE = {
  maxWidth: 610,
  gap: 30,
  avatarSize: 83,
  avatarRadius: 70,        
  nameSize: 22,
  bioSize: 13,
  btnTextSize: 15,
  font: 'Inter',
  btnRadius: 15,           // was 16 → 15px
  btnMinHeight: 104,       // was 72 → 104px
  accent: '#388bff',
  iconSize: 55,            // was 44 → 55px
  iconRadius: 12,
  marginAvatar: 14,
  marginName: 6,
  marginTagline: 3,
  marginSubtag: 10,
  marginLinks: 19,         // was 30 → 19px
  paddingTop: 81,          // was 48 → 81px
  btnPaddingV: 14,
  btnPaddingH: 10,
  iconAreaWidth: 81,       // was 72 → 81px
};

const PROFILE = {
  name:"Rafie", verified:true,
  tagline:"✦ Semua link ku ada di sini",
  subtags:["Link • Sosial Media • Info"],
};

const LINKS = [
  { id:1, title:"Grub WhatsApp",   desc:"Join untuk Free bisa menggunakan bot",  url:"https://chat.whatsapp.com/Bl3S3AnwTR0JuJewDZY17K", icon:"src/assets/grub.png"  },
  { id:2, title:"WhatsApp",    desc:"Hubungi ku lewat WhatsApp",    url:"https://wa.me/6285189884114", icon:"src/assets/avatar.jpg" },  
  { id:3, title:"Channel WhatsApp",     desc:"Informasi Bot WhatsApp", url:"https://whatsapp.com/channel/0029Vb72Y8lK0IBefjj4dV1R",   icon:"src/assets/channel.jpg"  },
  { id:4, title:"Harga Bot WhatsApp",      desc:"Informasi harga bot WhatsApp",   url:"",    icon:"src/assets/harga.jpg"  },
];

const CARD_GRADS = [
  ['#0d1320','#192440'],['#100e20','#1e1a38'],['#0e1820','#183040'],
  ['#1a0e14','#32182a'],['#141020','#241e38'],
];

function loadStyle() {
  try { const r=localStorage.getItem(LS_KEY); if(r) return {...DEFAULT_STYLE,...JSON.parse(r)}; } catch(e) {}
  return {...DEFAULT_STYLE};
}

function SliderRow({ label, value, min, max, step=1, unit='', onChange }) {
  return (
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontSize:13,color:'rgba(255,255,255,0.6)'}}>{label}</span>
        <span style={{fontSize:13,color:'rgba(255,255,255,0.9)',fontWeight:500}}>{value}{unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))}/>
    </div>
  );
}

function Sec({ children }) {
  return <div style={{fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.3)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:14,marginTop:22}}>{children}</div>;
}

function LinkCard({ link, index, s }) {
  const [hov,setHov]=useState(false),[prs,setPrs]=useState(false);
  const [ga,gb]=CARD_GRADS[index%CARD_GRADS.length];
  const iconAreaW = s.iconAreaWidth || 72;
  return (
    <div
      onClick={()=>window.open(link.url,'_blank')}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>{setHov(false);setPrs(false);}}
      onMouseDown={()=>setPrs(true)} onMouseUp={()=>setPrs(false)}
      style={{cursor:'pointer',animation:`fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) ${0.35+index*0.1}s both`,marginBottom:s.gap+'px',transform:prs?'scale(0.975)':hov?'scale(1.012)':'scale(1)',transition:'transform 0.2s ease',fontFamily:s.font+', sans-serif'}}>
      <div style={{borderRadius:s.btnRadius+'px',overflow:'hidden',background:`linear-gradient(135deg,${ga}ee,${gb}ee)`,backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',border:hov?`1px solid ${s.accent}55`:'1px solid rgba(255,255,255,0.08)',transition:'border 0.25s,box-shadow 0.25s',boxShadow:hov?'0 4px 32px rgba(0,0,0,0.55)':'0 2px 16px rgba(0,0,0,0.38)',display:'flex',alignItems:'stretch',minHeight:s.btnMinHeight+'px',position:'relative'}}>

        {/* blurred bg image inside card */}
        <div style={{position:'absolute',inset:0,backgroundImage:`url(${link.icon})`,backgroundSize:'cover',backgroundPosition:'center',filter:'blur(14px) brightness(0.25)',opacity:0.65,borderRadius:s.btnRadius+'px',zIndex:0}}/>

        {/* icon — lebar area dikontrol iconAreaWidth, padding dari btnPaddingV & btnPaddingH */}
        <div style={{width:iconAreaW+'px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',padding:`${s.btnPaddingV}px ${s.btnPaddingH}px`,position:'relative',zIndex:1}}>
          <div style={{width:s.iconSize+'px',height:s.iconSize+'px',borderRadius:s.iconRadius+'px',overflow:'hidden',border:'2px solid rgba(255,255,255,0.2)',flexShrink:0}}>
            <img src={link.icon} alt={link.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
          </div>
        </div>

        {/* text — padding vertikal dari btnPaddingV */}
        <div style={{flex:1,padding:`${s.btnPaddingV}px 8px`,display:'flex',flexDirection:'column',justifyContent:'center',gap:4,position:'relative',zIndex:1}}>
          <div style={{fontSize:s.btnTextSize+'px',fontWeight:700,color:'#fff',letterSpacing:'0.06em'}}>{link.title}</div>
          <div style={{fontSize:Math.max(10,s.btnTextSize-3)+'px',fontWeight:300,color:'rgba(255,255,255,0.5)',lineHeight:1.4}}>{link.desc}</div>
        </div>

        {/* arrow — padding kanan dari btnPaddingH */}
        <div style={{paddingRight:(s.btnPaddingH+8)+'px',display:'flex',alignItems:'center',flexShrink:0,position:'relative',zIndex:1}}>
          <div style={{width:34,height:34,borderRadius:'50%',background:hov?s.accent+'33':'rgba(255,255,255,0.08)',border:`1px solid ${hov?s.accent+'88':'rgba(255,255,255,0.14)'}`,display:'flex',alignItems:'center',justifyContent:'center',transition:'background 0.25s,transform 0.25s',transform:hov?'translateX(3px)':'none'}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5h8M6.5 2.5l4 4-4 4" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
        </div>
      </div>
    </div>
  );
}

function EditModal({ style:initS, onSave, onClose }) {
  const [ds,setDs]=useState({...initS});
  const upd=(k,v)=>setDs(s=>({...s,[k]:v}));
  return (
    <div style={{position:'fixed',inset:0,zIndex:2000,background:'rgba(5,3,15,0.88)',backdropFilter:'blur(14px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#0f0820',border:'1px solid #2d1b4e',borderRadius:'22px',padding:'20px',width:'100%',maxWidth:'420px',maxHeight:'90vh',display:'flex',flexDirection:'column',gap:'10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:17,fontWeight:600,color:'#e8e0f0'}}>🎨 Edit Warna</span>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#6d5a8a',fontSize:22,cursor:'pointer',lineHeight:1}}>×</button>
        </div>
        <div style={{overflowY:'auto',flex:1,paddingRight:4}}>

          <Sec>WARNA AKSEN</Sec>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
            {ACCENT_COLORS.map(c=>(
              <button key={c} onClick={()=>upd('accent',c)} style={{width:34,height:34,borderRadius:'50%',background:c,border:'none',cursor:'pointer',outline:ds.accent===c?`3px solid ${c}`:'3px solid transparent',outlineOffset:3,transition:'outline 0.15s'}}/>
            ))}
          </div>

          <button onClick={()=>{onSave(ds);onClose();}} style={{width:'100%',background:'linear-gradient(135deg,#7c3aed,#5b21b6)',border:'none',borderRadius:12,padding:12,color:'white',fontWeight:600,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginTop:16,marginBottom:4}}>
            Simpan Warna
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [style,setStyle]=useState(loadStyle);
  const [editOpen,setEditOpen]=useState(false);
  const handleSave=s=>{setStyle(s);try{localStorage.setItem(LS_KEY,JSON.stringify(s));}catch(e){}};
  const avR=style.avatarRadius>0?style.avatarRadius+'px':'50%';

  return (
    <div style={{position:'relative',zIndex:2,minHeight:'100vh',fontFamily:style.font+', sans-serif'}}>
      <div style={{maxWidth:style.maxWidth+'px',margin:'0 auto',padding:`${style.paddingTop}px 18px 80px`,display:'flex',flexDirection:'column',alignItems:'center'}}>

        {/* AVATAR */}
        <div style={{animation:'avatarIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.1s both',marginBottom:style.marginAvatar+'px',position:'relative'}}>
          <div style={{position:'absolute',inset:'-3px',borderRadius:(style.avatarRadius>0?(style.avatarRadius+4)+'px':'50%'),background:`conic-gradient(from 0deg,${style.accent},#818cf8,#c084fc,${style.accent})`,animation:'rotateBorder 3s linear infinite'}}/>
          <div style={{position:'relative',width:style.avatarSize+'px',height:style.avatarSize+'px',borderRadius:avR,overflow:'hidden',border:'3px solid #09070f'}}>
            <img src="src/assets/avatar.jpg" alt="Avatar" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
          </div>
        </div>

        {/* NAMA + BADGE */}
        <div style={{display:'flex',alignItems:'center',gap:7,animation:'fadeUp 0.5s ease 0.2s both',marginBottom:style.marginName+'px'}}>
          <h1 style={{fontFamily:style.font+', sans-serif',fontSize:style.nameSize+'px',fontWeight:700,color:'#fff',letterSpacing:'0.01em'}}>{PROFILE.name}</h1>
          {PROFILE.verified&&(
            <div style={{width:22,height:22,borderRadius:'50%',background:`linear-gradient(135deg,${style.accent},#4f8ef7)`,display:'flex',alignItems:'center',justifyContent:'center',animation:'badgePulse 2.5s ease-in-out infinite',flexShrink:0}}>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          )}
        </div>

        {/* TAGLINE */}
        <p style={{fontSize:style.bioSize+'px',fontWeight:400,color:'rgba(255,255,255,0.62)',letterSpacing:'0.03em',animation:'fadeUp 0.5s ease 0.28s both',marginBottom:style.marginTagline+'px',textAlign:'center'}}>{PROFILE.tagline}</p>

        {/* SUBTAGS */}
        {PROFILE.subtags.map((t,i)=>(
          <p key={i} style={{fontSize:Math.max(10,style.bioSize-1)+'px',fontWeight:300,color:'rgba(255,255,255,0.38)',letterSpacing:'0.05em',animation:`fadeUp 0.5s ease ${0.33+i*0.05}s both`,marginBottom:style.marginSubtag+'px',textAlign:'center'}}>{t}</p>
        ))}

        {/* LINKS */}
        <div style={{width:'100%',marginBottom:style.marginLinks+'px'}}>
          {LINKS.map((link,i)=><LinkCard key={link.id} link={link} index={i} s={style}/>)}
        </div>

        <p style={{fontSize:11,color:'rgba(255,255,255,0.18)',letterSpacing:'0.12em',animation:'fadeUp 0.5s ease 1.1s both'}}>rafie.link</p>
      </div>

      {/* FLOATING EDIT BUTTON */}
      <button onClick={()=>setEditOpen(true)}
        style={{position:'fixed',bottom:22,right:22,width:50,height:50,borderRadius:'50%',background:`linear-gradient(135deg,${style.accent},#5b21b6)`,border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 4px 22px ${style.accent}88`,zIndex:100,animation:'fadeUp 0.5s ease 1s both',transition:'transform 0.2s'}}
        onMouseEnter={e=>e.currentTarget.style.transform='scale(1.1)'}
        onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}>
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none"><path d="M15.5 3.5a2.121 2.121 0 013 3L7 18l-4 1 1-4L15.5 3.5z" stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>

      {editOpen&&<EditModal style={style} onSave={handleSave} onClose={()=>setEditOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
